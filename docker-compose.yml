services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    networks:
      - cms-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Strapi CMS
  strapi:
    build:
      context: ./strapi-docker
      dockerfile: Dockerfile
    container_name: cms-strapi
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: false
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      APP_KEYS: ${APP_KEYS}
    volumes:
      - strapi-app:/opt/app
    ports:
      - '1337:1337'
    networks:
      - cms-network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        if [ ! -f package.json ]; then
          echo 'Creating new Strapi project...'
          echo 'n' | npx create-strapi-app@latest . --quickstart --no-run --skip-cloud
        fi
        echo 'Ensuring PostgreSQL driver is installed...'
        npm install pg --save
        echo 'Starting Strapi...'
        yarn develop
      "

volumes:
  postgres-data:
  strapi-app:

networks:
  cms-network:
    driver: bridge
